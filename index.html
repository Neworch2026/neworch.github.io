<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Visiting Card</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f3;
}
.card {
  max-width: 360px;
  background: #fff;
  margin: 30px auto;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.logo {
  width: 80px;
}
.profile {
  width: 120px;
  border-radius: 50%;
  margin-top: 10px;
}
h2 {
  margin: 10px 0 5px;
}
h4 {
  margin: 0;
  color: #555;
}
.info {
  margin-top: 10px;
}
a {
  display: block;
  margin: 8px 0;
  text-decoration: none;
  color: #0a66c2;
}
</style>
</head>

<body>
<div class="card">
  <img class="logo" src="../images/logo.png"><br>
  <img class="profile" src="../images/emp1.jpg">

  <h2>Employee Name</h2>
  <h4>Designation</h4>

  <div class="info">
    <p><b>Neworch Pvt Ltd</b></p>
    <p>Company Address</p>

    <a href="tel:+919999999999">📞 +91 99999 99999</a>
    <a href="mailto:email@neworch.com">✉️ email@neworch.com</a>
  </div>
</div>
</body>
</html>
